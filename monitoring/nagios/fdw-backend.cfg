define host {
    use                     linux-server
    host_name               fdw-backend
    alias                   FDW Spring Boot Backend
    address                 backend
    check_command           check_tcp!8081
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    contact_groups          admins
}

define command {
    command_name    check_actuator_health
    command_line    /opt/nagios/libexec/check_http -H $HOSTADDRESS$ -p 8081 -S -u /actuator/health -s '"status":"UP"'
}

define command {
    command_name    check_prom_heap
    command_line    /opt/nagios/libexec/check_prom_heap.sh
}

define service {
    use                     generic-service
    host_name               fdw-backend
    service_description     Actuator Health
    check_command           check_actuator_health
    check_interval          1
    retry_interval          1
}

define service {
    use                     generic-service
    host_name               fdw-backend
    service_description     JVM Heap Usage
    check_command           check_prom_heap
    check_interval          1
    retry_interval          1
}

define command {
    command_name    check_prom_security
    command_line    python3 /opt/nagios/libexec/check_prom_security.py
}