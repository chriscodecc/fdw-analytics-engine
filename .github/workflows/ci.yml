name: DevSecOps Pipeline

on:
    push:
        branches: [main, devsecops-pipline]
    pull_request:
        branches: [main, devsecops-pipline]

jobs:
    build-and-test:
        name: Build & Test
        runs-on: ubuntu-24.04

        steps:
            # 1. Fetches Sourcode from the repository
        -   name: Sourcecode checkout
            uses: actions/checkout@v5

            # 2. Install java
        -   name: Install JDK 21
            uses: actions/setup-java@v5
            with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven

            # 3. Runs the local commands in the Cloud
        -   name: Run tests
            run: mvn test --batch-mode