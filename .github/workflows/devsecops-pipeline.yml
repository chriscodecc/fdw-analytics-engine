#main
env:
  APP_API_KEY: ${{ secrets.APP_API_KEY }}
  SERVER_SSL_KEY_STORE_PASSWORD: ${{ secrets.SSL_ADMIN_PASSWORD }}

name: DevSecOps Pipeline
on:
    push:
        branches: [main, devsecops-pipline]
    pull_request:
        branches: [main, devsecops-pipline]

# Top-level default: enforce read-only repo access across all jobs
permissions:
  contents: read

jobs:
    gitleaks-scan:
        name: Secret Detection (Gitleaks)
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-and-test:
        name: Build & Test
        needs: [gitleaks-scan]
        runs-on: ubuntu-24.04
        steps:
            # 1. Fetches Sourcode from the repository
        -   name: Sourcecode checkout
            uses: actions/checkout@v4
            # 2. Install java
        -   name: Install JDK 21
            uses: actions/setup-java@v4
            with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven
            # 3. Runs the local commands in the Cloud
        -   name: Run tests
            env:
                APP_API_KEY: ${{ secrets.APP_API_KEY }}
            run: mvn test --batch-mode

jobs:
    test-toke-permissions:
        name: Verify Least Privilege Token
        runs-on: ubuntu-24.04
        steps:
        - name: Attempt Unauthorized Git Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Testing if GITHUB_TOKEN has write access..."
          # Configure dummy git identity for the runner
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Attempt to create and push a remote tag
          git tag test-unauthorized-tag
          git push origin test-unauthorized-tag