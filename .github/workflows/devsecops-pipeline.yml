#main
env:
  APP_API_KEY: ${{ secrets.APP_API_KEY }}
  SERVER_SSL_KEY_STORE_PASSWORD: ${{ secrets.SSL_ADMIN_PASSWORD }}

name: DevSecOps Pipeline
on:
    push:
        branches: [main, devsecops-*]
    pull_request:
        branches: [main, devsecops-*]

# Top-level default: enforce read-only access 
permissions:
  contents: read

jobs:
    #Gate 1
    gitleaks-scan:
        name: Secret Detection (Gitleaks)
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # Gate 2
    trivy-fs-scan:
        name: Dependency Vulnerability Scan (Trivy FS)
        needs: [gitleaks-scan]
        runs-on: ubuntu-24.04
        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Run Trivy vulnerability scanner in fs mode
            uses: aquasecurity/trivy-action@0.35.0
            with:
                scan-type: 'config'
                scan-ref: '.'
                scanners: 'vuln,license,misconfig'
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                severity: 'HIGH,CRITICAL'

    # Gate 3
    sast-scan:
        name: Static Code Analysis (Semgrep SAST)
        needs: [trivy-fs-scan]
        runs-on: ubuntu-24.04
        container:
            image: semgrep/semgrep:latest
        steps: 
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Run Semgrep SAST scan 
            run: >
                semgrep scan --config 
                p/java --config 
                p/python --config 
                p/owasp-top-ten --error 
                --severity ERROR 
                --metrics=off 
                --verbose

    # Gate 4
    build-and-test:
        name: Build & Test
        needs: [sast-scan]
        runs-on: ubuntu-24.04
        steps:
            # 1. Fetches Sourcode from the repository
        -   name: Sourcecode checkout
            uses: actions/checkout@v4
            # 2. Install java
        -   name: Install JDK 21
            uses: actions/setup-java@v4
            with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven
            # 3. Runs the local commands in the Cloud
        -   name: Run tests
            env:
                APP_API_KEY: ${{ secrets.APP_API_KEY }}
            run: mvn test --batch-mode

    # Gate5
    docker:
        name: Build Docker Images 
        needs: [build-and-test]
        runs-on: ubuntu-24.04
      
        steps:
        -   name: Sourcecode checkout
            uses: actions/checkout@v4
            with:
                submodules: true

        -   name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4

        -   name: Build and push fwd
            uses: docker/build-push-action@v7
            with:
                context: "."
                push: false
                tags: fdw-backend:${{ github.sha }}
                load: true

        -   name: Build and push FinDataWarehouse
            uses: docker/build-push-action@v7
            with:
                context: "./FinDataWarehouse"
                push: false
                tags: fdw-etl:${{ github.sha }}
                load: true

        -   name: Build and push dashboard
            uses: docker/build-push-action@v7
            with:
                context: "./dashboard"
                push: false
                tags: fdw-dashboard:${{ github.sha }}
                load: true

        -   name: Image Vulnerability Scanning - backend
            uses: aquasecurity/trivy-action@0.35.0
            with:
                scan-type: 'image'
                vuln-type: 'os'
                image-ref: fdw-backend:${{ github.sha }} 
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                severity: 'HIGH,CRITICAL'
        
        -   name: Image Vulnerability Scanning - etl
            uses: aquasecurity/trivy-action@0.35.0
            with:
                scan-type: 'image'
                vuln-type: 'os'
                image-ref: fdw-etl:${{ github.sha }} 
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                severity: 'HIGH,CRITICAL'
                skip-setup-trivy: true

        -   name: Image Vulnerability Scanning - dashboard
            uses: aquasecurity/trivy-action@0.35.0
            with:
                scan-type: 'image'
                vuln-type: 'os'
                image-ref: fdw-dashboard:${{ github.sha }} 
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                severity: 'HIGH,CRITICAL'
                skip-setup-trivy: true
       
    # Gate 6
    zap_scan: 
        name: DAST Security Scan (OWASP ZAP)
        #needs: [docker]
        runs-on: ubuntu-24.04
        steps:
        -   name: checkout repository
            uses: actions/checkout@v4
            with:
                submodules: true

        -   name: Start application stack
            env: 
                DB_USER: "ci_user"
                DB_PASSWORD: "ci_password"
                DB_NAME: "fdw_db"
                APP_API_KEY: "ci-dast-test-key"
                SSL_ADMIN_PASSWORD: ${{ secrets.SSL_ADMIN_PASSWORD }}
            run: |
                docker compose up -d --build || (docker compose logs database && exit 1)
                echo "Waiting for Dashboard (:8501)..."
                timeout 60 bash -c 'until curl -sf http://localhost:8501/_stcore/health > /dev/null; do sleep 2; done'
                echo "Waiting for Backend HTTPS (:8080)..."
                timeout 60 bash -c 'until curl -sk -o /dev/null https://localhost:8080/api/v1/analytics; do sleep 2; done'

        -   name: ZAP Scan - Dashboard
            uses: zaproxy/action-baseline@v0.15.0
            with:
                target: 'http://localhost:8501'
                allow_issue_writing: false

        -   name: ZAP Scan - Backend API
            uses: zaproxy/action-api-scan@v0.10.0
            env:
                ZAP_AUTH_HEADER: API_KEY
                ZAP_AUTH_HEADER_VALUE: "ci-dast-test-key"
            with:
                target: 'https://localhost:8080/api/v1/analytics'
                allow_issue_writing: false

        -   name: Tear down stack
            if: always()
            run: docker compose down -v

