name: DevSecOps Pipeline
on:
    push:
        branches: [main, devsecops-pipline]
    pull_request:
        branches: [main, devsecops-pipline]
jobs:
    gitleaks-scan:
        name: Secret Detection (Gitleaks)
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0 # Gitleaks needs full git history to scan previous commits

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-and-test:
        name: Build & Test
        runs-on: ubuntu-24.04
        steps:
            # 1. Fetches Sourcode from the repository
        -   name: Sourcecode checkout
            uses: actions/checkout@v5
            # 2. Install java
        -   name: Install JDK 21
            uses: actions/setup-java@v5
            with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven
            # 3. Runs the local commands in the Cloud
        -   name: Run tests
            run: mvn test --batch-mode

