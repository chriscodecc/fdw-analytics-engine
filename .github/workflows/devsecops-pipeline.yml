#main
env:
  APP_API_KEY: ${{ secrets.APP_API_KEY }}
  SERVER_SSL_KEY_STORE_PASSWORD: ${{ secrets.SSL_ADMIN_PASSWORD }}

name: DevSecOps Pipeline
on:
    push:
        branches: [main, devsecops-*]
    pull_request:
        branches: [main, devsecops-*]

# Top-level default: enforce read-only access 
permissions:
  contents: read

jobs:
    #Gate 1
    gitleaks-scan:
        name: Secret Detection (Gitleaks)
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # Gate 2
    trivy-fs-scan:
        name: Dependency Vulnerability Scan (Trivy FS)
        needs: [gitleaks-scan]
        runs-on: ubuntu-24.04
        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Run Trivy vulnerability scanner in fs mode
            uses: aquasecurity/trivy-action@0.35.0
            with:
                scan-type: 'fs'
                scan-ref: '.'
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                severity: 'HIGH,CRITICAL'

    # Gate 3
    sast-scan:
        name: Static Code Analysis (Semgrep SAST)
        needs: [trivy-fs-scan]
        runs-on: ubuntu-24.04
        container:
            image: semgrep/semgrep:latest
        steps: 
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Run Semgrep SAST scan 
            run: >
                semgrep scan --config 
                p/java --config 
                p/python --config 
                p/owasp-top-ten --error 
                --severity ERROR 
                --metrics=off 
                --verbose


    # Gate 4
    build-and-test:
        name: Build & Test
        needs: [sast-scan]
        runs-on: ubuntu-24.04
        steps:
            # 1. Fetches Sourcode from the repository
        -   name: Sourcecode checkout
            uses: actions/checkout@v4
            # 2. Install java
        -   name: Install JDK 21
            uses: actions/setup-java@v4
            with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven
            # 3. Runs the local commands in the Cloud
        -   name: Run tests
            env:
                APP_API_KEY: ${{ secrets.APP_API_KEY }}
            run: mvn test --batch-mode
